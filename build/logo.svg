<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#29243e"/><stop offset="1" stop-color="#14141e"/>
    </linearGradient>
    <radialGradient id="planet" cx=".35" cy=".3">
      <stop stop-color="#faf6ff"/><stop offset="1" stop-color="#b6abff"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="48" fill="url(#bg)" stroke="#8274cd" stroke-opacity=".45" stroke-width="3"/>
  <ellipse cx="128" cy="128" rx="86" ry="55" transform="rotate(-24 128 128)" fill="none" stroke="#b6abff" stroke-width="5" opacity=".94"/>
  <circle cx="188" cy="83" r="8" fill="#96e7ff" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="22" fill="url(#planet)" filter="url(#glow)"/>
</svg>
