name: Build and publish Orbit Chat

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: orbit-chat-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Verify and build the app
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Build portable Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^\d+\.\d+\.\d+$') { throw "Release tag must be plain semantic version form (for example, 1.3.5): $tag" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $tag) { throw "Git tag $tag does not match package.json version $version." }

          npx electron-builder --win --x64 --dir '--config.directories.output=release'
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE" }

          & scripts/build-portable-zip.ps1 -PortableDirectory 'release\win-unpacked' -OutputDirectory 'release' -Version $version
          if ($LASTEXITCODE -ne 0) { throw "Portable ZIP build failed with exit code $LASTEXITCODE" }

      - name: Create release notes from commits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $previousTag = & git describe --tags --abbrev=0 "$tag^" 2>$null
          $describeExit = $LASTEXITCODE
          if ($describeExit -eq 0 -and $previousTag) {
            $changes = & git log --no-merges --format='- %s' "$previousTag..$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not collect changes for release notes.' }
          } else {
            $changes = & git log --no-merges -n 20 --format='- %s' $tag
            if ($LASTEXITCODE -ne 0) { throw 'Could not collect changes for release notes.' }
          }
          if (-not $changes) { $changes = '- Maintenance and bug fixes.' }
          $notes = "## Orbit Chat $tag`n`n### Changes`n$($changes -join "`n")`n`nThe portable Windows x64 package includes the in-app updater."
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'orbit-chat-release-notes.md'), $notes, [System.Text.UTF8Encoding]::new($false))

      - name: Publish to OrbitChat-releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'redoszeryk0-sys/OrbitChat-releases'
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notesFile = Join-Path $env:RUNNER_TEMP 'orbit-chat-release-notes.md'

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $repo --title "Orbit Chat $version" --notes-file $notesFile
          } else {
            gh release create $tag --repo $repo --title "Orbit Chat $version" --notes-file $notesFile
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not create or update release $tag in $repo." }

          gh release upload $tag "release\Orbit-Chat-$version-win-x64.zip" --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the portable app ZIP.' }

          gh release upload Online_installer 'release\Orbit-Chat-Updater.exe' --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the legacy updater fallback asset.' }
